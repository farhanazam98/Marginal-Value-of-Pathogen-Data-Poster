<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#12325B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1580" fill="#ffffff"/>

  <!-- Steps 2-7 of the original 7-step schematic, with the first stage
       ("Setup & Validate Query") dropped and everything shifted up 260. -->
  <g transform="translate(0,-260)">

  <!-- ================= STEP 1 ================= -->
  <g>
    <rect x="100" y="280" width="680" height="220" rx="18" fill="none" stroke="#1E7D6B" stroke-width="3"/>
    <circle cx="150" cy="320" r="26" fill="#1E7D6B"/>
    <text x="150" y="329" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <!-- magnifying glass + lines icon -->
    <g transform="translate(190,350)" stroke="#1E7D6B" stroke-width="5" fill="none" stroke-linecap="round">
      <circle cx="30" cy="30" r="28"/>
      <line x1="50" y1="50" x2="72" y2="72"/>
      <line x1="90" y1="20" x2="140" y2="20"/>
      <line x1="90" y1="40" x2="140" y2="40"/>
      <line x1="90" y1="60" x2="130" y2="60"/>
    </g>

    <text x="390" y="375" font-size="34" font-weight="bold" fill="#1E7D6B">Homology Search</text>
    <text x="390" y="415" font-size="24" fill="#1a1a1a">jackhmmer search &#8594;</text>
    <text x="390" y="445" font-size="24" fill="#1a1a1a">raw MSA</text>
  </g>
  <line x1="440" y1="500" x2="440" y2="540" stroke="#12325B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ================= STEP 2 ================= -->
  <g>
    <rect x="100" y="540" width="680" height="220" rx="18" fill="none" stroke="#12325B" stroke-width="3"/>
    <circle cx="150" cy="580" r="26" fill="#12325B"/>
    <text x="150" y="589" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <!-- matrix icon -->
    <g transform="translate(190,600)" font-size="16" fill="#12325B" font-family="monospace">
      <text x="0" y="0" font-weight="bold">A   C   D  ... Y</text>
      <text x="0" y="25">&#8226;   &#8226;   &#8226;  ...  &#8722;</text>
      <text x="0" y="50">&#8226;   &#8226;   &#8226;  ...  &#8722;</text>
      <text x="0" y="75">&#8226;   &#8226;   &#8226;  ...  &#8722;</text>
      <text x="0" y="100">&#8226;   &#8226;   &#8226;  ...  &#8722;</text>
    </g>

    <text x="390" y="635" font-size="34" font-weight="bold" fill="#12325B">Clean &amp; Filter MSA</text>
    <text x="390" y="675" font-size="24" fill="#1a1a1a">Stockholm &#8594; N&#215;L matrix,</text>
    <text x="390" y="705" font-size="24" fill="#1a1a1a">EVEREST filters</text>
  </g>
  <line x1="440" y1="760" x2="440" y2="800" stroke="#12325B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ================= STEP 3 ================= -->
  <g>
    <rect x="100" y="800" width="680" height="220" rx="18" fill="none" stroke="#1E7D6B" stroke-width="3"/>
    <circle cx="150" cy="840" r="26" fill="#1E7D6B"/>
    <text x="150" y="849" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <!-- balance scale icon -->
    <g transform="translate(190,860)" stroke="#1E7D6B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="65" y1="0" x2="65" y2="100"/>
      <line x1="20" y1="100" x2="110" y2="100"/>
      <line x1="10" y1="20" x2="120" y2="20"/>
      <circle cx="65" cy="15" r="6" fill="#1E7D6B"/>
      <line x1="10" y1="20" x2="10" y2="50"/>
      <line x1="120" y1="20" x2="120" y2="50"/>
      <path d="M-8,50 A18,18 0 0 0 28,50 Z" transform="translate(0,0)"/>
      <path d="M102,50 A18,18 0 0 0 138,50 Z"/>
      <circle cx="0" cy="45" r="5" fill="#1E7D6B" stroke="none"/>
      <circle cx="10" cy="40" r="5" fill="#1E7D6B" stroke="none"/>
      <circle cx="20" cy="45" r="5" fill="#1E7D6B" stroke="none"/>
      <circle cx="115" cy="45" r="5" fill="#1E7D6B" stroke="none"/>
    </g>

    <text x="390" y="895" font-size="34" font-weight="bold" fill="#1E7D6B">Sequence Reweighting</text>
    <text x="390" y="935" font-size="24" fill="#1a1a1a">99%-identity reweighting,</text>
    <text x="390" y="965" font-size="24" fill="#1a1a1a">Neff</text>
  </g>
  <line x1="440" y1="1020" x2="440" y2="1060" stroke="#12325B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ================= STEP 4 ================= -->
  <g>
    <rect x="100" y="1060" width="680" height="220" rx="18" fill="none" stroke="#12325B" stroke-width="3"/>
    <circle cx="150" cy="1100" r="26" fill="#12325B"/>
    <text x="150" y="1109" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    <!-- bar chart icon -->
    <g transform="translate(190,1120)" fill="#12325B">
      <rect x="0" y="60" width="14" height="40"/>
      <rect x="24" y="30" width="14" height="70"/>
      <rect x="48" y="45" width="14" height="55"/>
      <rect x="72" y="10" width="14" height="90"/>
      <rect x="96" y="50" width="14" height="50"/>
      <line x1="-5" y1="100" x2="120" y2="100" stroke="#12325B" stroke-width="3"/>
      <text x="4" y="120" font-size="14" stroke="none" fill="#12325B">A</text>
      <text x="28" y="120" font-size="14" stroke="none" fill="#12325B">C</text>
      <text x="52" y="120" font-size="14" stroke="none" fill="#12325B">D</text>
      <text x="88" y="120" font-size="14" stroke="none" fill="#12325B">Y</text>
    </g>

    <text x="390" y="1155" font-size="34" font-weight="bold" fill="#12325B">Build PSSM</text>
    <text x="390" y="1195" font-size="24" fill="#1a1a1a">per-column amino</text>
    <text x="390" y="1225" font-size="24" fill="#1a1a1a">acid frequencies</text>
  </g>
  <line x1="440" y1="1280" x2="440" y2="1320" stroke="#12325B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ================= STEP 5 ================= -->
  <g>
    <rect x="100" y="1320" width="680" height="240" rx="18" fill="none" stroke="#1E7D6B" stroke-width="3"/>
    <circle cx="150" cy="1360" r="26" fill="#1E7D6B"/>
    <text x="150" y="1369" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">5</text>

    <!-- score table icon -->
    <g transform="translate(196,1385) scale(0.85)" font-size="13" font-family="monospace" fill="#1E7D6B">
      <rect x="35" y="-15" width="150" height="105" fill="none" stroke="#1E7D6B" stroke-width="2"/>
      <line x1="35" y1="10" x2="185" y2="10" stroke="#1E7D6B" stroke-width="1.5"/>
      <line x1="35" y1="35" x2="185" y2="35" stroke="#1E7D6B" stroke-width="1.5"/>
      <line x1="35" y1="60" x2="185" y2="60" stroke="#1E7D6B" stroke-width="1.5"/>
      <line x1="72" y1="-15" x2="72" y2="90" stroke="#1E7D6B" stroke-width="1.5"/>
      <line x1="109" y1="-15" x2="109" y2="90" stroke="#1E7D6B" stroke-width="1.5"/>
      <line x1="146" y1="-15" x2="146" y2="90" stroke="#1E7D6B" stroke-width="1.5"/>
      <text x="-14" y="-2">pos 1</text>
      <text x="-14" y="23">pos 2</text>
      <text x="-14" y="48">...</text>
      <text x="-14" y="80">pos N</text>
      <text x="40" y="-2">0.5</text>
      <text x="77" y="-2">-1.2</text>
      <text x="151" y="-2">0.3</text>
      <text x="40" y="23">-0.7</text>
      <text x="77" y="23">0.8</text>
      <text x="151" y="23">-1.1</text>
      <text x="40" y="80">0.2</text>
      <text x="77" y="80">-0.4</text>
      <text x="151" y="80">1.3</text>
    </g>

    <text x="390" y="1400" font-size="34" font-weight="bold" fill="#1E7D6B">Score Variants</text>
    <text x="390" y="1440" font-size="24" fill="#1a1a1a">log-odds scoring</text>
    <text x="390" y="1470" font-size="24" fill="#1a1a1a">of DMS variants</text>
  </g>
  <line x1="440" y1="1560" x2="440" y2="1600" stroke="#12325B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ================= STEP 6 ================= -->
  <g>
    <rect x="100" y="1600" width="680" height="220" rx="18" fill="none" stroke="#12325B" stroke-width="3"/>
    <circle cx="150" cy="1640" r="26" fill="#12325B"/>
    <text x="150" y="1649" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">6</text>

    <!-- scatter plot icon -->
    <g transform="translate(185,1650)">
      <line x1="0" y1="0" x2="0" y2="100" stroke="#12325B" stroke-width="3"/>
      <line x1="0" y1="100" x2="120" y2="100" stroke="#12325B" stroke-width="3"/>
      <text x="-14" y="55" font-size="11" fill="#12325B" transform="rotate(-90,-14,55)">Predicted score</text>
      <text x="30" y="118" font-size="12" fill="#12325B">DMS score</text>
      <circle cx="15" cy="80" r="3.5" fill="#12325B"/>
      <circle cx="25" cy="70" r="3.5" fill="#12325B"/>
      <circle cx="35" cy="75" r="3.5" fill="#12325B"/>
      <circle cx="40" cy="55" r="3.5" fill="#12325B"/>
      <circle cx="50" cy="60" r="3.5" fill="#12325B"/>
      <circle cx="55" cy="45" r="3.5" fill="#12325B"/>
      <circle cx="65" cy="50" r="3.5" fill="#12325B"/>
      <circle cx="70" cy="35" r="3.5" fill="#12325B"/>
      <circle cx="80" cy="40" r="3.5" fill="#12325B"/>
      <circle cx="85" cy="25" r="3.5" fill="#12325B"/>
      <circle cx="95" cy="30" r="3.5" fill="#12325B"/>
      <circle cx="100" cy="15" r="3.5" fill="#12325B"/>
      <circle cx="110" cy="20" r="3.5" fill="#12325B"/>
      <line x1="8" y1="90" x2="112" y2="10" stroke="#12325B" stroke-width="2"/>
    </g>

    <text x="390" y="1665" font-size="34" font-weight="bold" fill="#12325B">Evaluate</text>
    <text x="390" y="1705" font-size="24" fill="#1a1a1a">Spearman &#961; vs. DMS assays,</text>
    <text x="390" y="1735" font-size="24" fill="#1a1a1a">bootstrap CI, scatter</text>
  </g>

  </g>
</svg>
